<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Two sailing games in one: race a yacht round buoys in a storm, or drift a lantern boat through a flooded candle hall.">
<title>Storm Sailing</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Inter:wght@400;500;600&display=swap">
<style>
html{box-sizing:border-box;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px}
[hidden]{display:none!important}
</style>
<style>
/* Layout: the sea is the whole page. Instruments float top-left, the wind dial top-right,
   and the weather controls sit in one low glass bar so the horizon stays clear. */
:root{
  --sea-ink:#0a1418;
  --glass:rgba(11,24,30,.66);
  --foam:#e9f1ef;
  --mist:#a3b7b8;
  --seaglass:#74d6c2;
  --line:rgba(233,241,239,.17);
  --font-display:'Big Shoulders Display','Arial Narrow','Helvetica Neue',sans-serif;
  --font-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--sea-ink);color:var(--foam);font-family:var(--font-body);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#sea{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#sea:active{cursor:grabbing}
#app::before{content:"";position:fixed;inset:0 0 auto;height:150px;pointer-events:none;
  background:linear-gradient(rgba(6,14,18,.62),rgba(6,14,18,0))}
.top{position:relative}
#app{position:relative;height:100%;display:flex;flex-direction:column;justify-content:space-between;
  pointer-events:none;padding-block:12px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px))}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.gauges{display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap;min-width:0;
  text-shadow:0 1px 10px rgba(0,0,0,.55)}
.gauge{display:flex;flex-direction:column;gap:2px}
.gauge b{font-family:var(--font-display);font-weight:800;font-size:2.6rem;line-height:.9;
  font-variant-numeric:tabular-nums;letter-spacing:.01em}
.gauge b small{font-size:1rem;font-weight:600;color:var(--mist);margin-left:3px}
.label{font-size:.66rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--mist)}
.sail{font-family:var(--font-display);font-weight:600;font-size:1.25rem;line-height:1;color:var(--seaglass)}
.dial{width:74px;flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;
  text-shadow:0 1px 10px rgba(0,0,0,.55)}
.dial svg{width:74px;height:74px;display:block;filter:drop-shadow(0 2px 8px rgba(0,0,0,.4))}
.hint{align-self:center;background:var(--glass);border:1px solid var(--line);border-radius:999px;
  padding:8px 16px;font-size:.82rem;color:var(--foam);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  transition:opacity .6s}
.hint.gone{opacity:0}
.deck{pointer-events:auto;align-self:center;width:100%;max-width:720px;background:var(--glass);
  border:1px solid var(--line);border-radius:14px;padding:12px 14px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  display:flex;flex-direction:column;gap:10px}
.sliders{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.ctl{display:flex;flex-direction:column;gap:6px;min-width:0}
.ctl .row{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.ctl output{font-family:var(--font-display);font-weight:600;font-size:1.02rem;color:var(--foam);
  white-space:nowrap;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:var(--line)}
input[type=range]::-moz-range-track{height:3px;border-radius:2px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;
  background:var(--seaglass);border:2px solid var(--sea-ink);margin-top:-8px}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--seaglass);border:2px solid var(--sea-ink)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
button{font:500 .8rem var(--font-body);color:var(--foam);background:transparent;border:1px solid var(--line);
  border-radius:8px;padding:8px 12px;cursor:pointer;flex:1 1 auto;white-space:nowrap}
button:hover{border-color:var(--seaglass)}
button[aria-pressed=true]{background:var(--seaglass);color:var(--sea-ink);border-color:var(--seaglass)}
button:focus-visible,input:focus-visible{outline:2px solid var(--seaglass);outline-offset:2px}
#fail{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--foam);background:var(--sea-ink)}
#app[data-mode="menu"] .top,#app[data-mode="menu"] .deck,#app[data-mode="menu"] .hint{display:none}
#app:not([data-mode="race"]) .only-race{display:none}
#app:not([data-mode="drift"]) .only-drift{display:none}
#app:not([data-mode="menu"]) #menu{display:none}
.overlay{position:absolute;inset:0;display:grid;place-items:center;padding:16px;pointer-events:none}
.card{pointer-events:auto;box-sizing:border-box;width:100%;max-width:400px;background:var(--glass);border:1px solid var(--line);border-radius:16px;
  padding:22px 20px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;flex-direction:column;gap:12px}
.card h1,.card h2{margin:0;font-family:var(--font-display);font-weight:800;font-size:2.6rem;line-height:.95;letter-spacing:.01em;text-wrap:balance}
.card h2{font-size:2rem}
.card p{margin:0;color:var(--mist);font-size:.92rem;line-height:1.45}
button.mode{display:flex;flex-direction:column;gap:3px;text-align:left;padding:13px 15px;border-radius:11px;white-space:normal;flex:none}
button.mode strong{font-family:var(--font-display);font-weight:600;font-size:1.35rem;color:var(--seaglass);letter-spacing:.01em}
button.mode span{font-size:.84rem;color:var(--mist);line-height:1.35}
.card .btns button{flex:1 1 0}
#raceTime{font-family:var(--font-display);font-weight:800;font-size:2.6rem;line-height:.9;font-variant-numeric:tabular-nums}
@media (max-width:480px){
  .gauge b{font-size:2.1rem}
  .sliders{gap:10px}
  .ctl output{font-size:.92rem}
  .label{font-size:.6rem;letter-spacing:.1em}
}
</style>
</head>
<body>
<canvas id="sea" aria-label="A sailboat on a rainy sea. Drag left or right to steer."></canvas>

<div id="app" data-mode="menu">
  <div class="top">
    <div class="gauges">
      <div class="gauge only-race"><span class="label" id="markLbl">Mark 1 of 4</span><b id="raceTime">0:00.0</b></div>
      <div class="gauge only-drift"><span class="label">Lanterns lit</span><b><span id="lit">0</span><small>of 8</small></b></div>
      <div class="gauge only-race"><span class="label">Speed</span><b><span id="kn">0.0</span><small>kn</small></b></div>
      <div class="gauge only-race"><span class="label">Heading</span><b><span id="hdg">000</span><small>°</small></b></div>
      <div class="gauge only-race"><span class="label" id="tack">Starboard tack</span><span class="sail" id="pos">Beam reach</span></div>
    </div>
    <div class="dial only-race" aria-hidden="true">
      <svg viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="44" fill="rgba(11,24,30,.55)" stroke="rgba(233,241,239,.25)" stroke-width="1.5"/>
        <path d="M50 28 C58 40 58 60 54 72 L46 72 C42 60 42 40 50 28Z" fill="#e9f1ef"/>
        <g id="windArrow"><path d="M50 30 L57 16 L52 18 L52 4 L48 4 L48 18 L43 16Z" fill="#74d6c2"/></g>
        <g id="markDot"><circle cx="50" cy="6" r="5" fill="#ffb347" stroke="#0a1418" stroke-width="1.5"/></g>
      </svg>
      <span class="label">Wind</span>
    </div>
  </div>

  <div class="hint" id="hint">Drag left or right to steer</div>
  <div class="overlay" id="menu"><div class="card">
    <h1>Storm Sailing</h1>
    <p>Two ways onto the water.</p>
    <button class="mode" id="goRace" type="button"><strong>Race the storm</strong><span>Round four buoys against the clock. Dark patches on the water are gusts.</span></button>
    <button class="mode" id="goDrift" type="button"><strong>Drift</strong><span>Take the lantern boat through a flooded candle hall. No clock.</span></button>
  </div></div>
  <div class="overlay" id="result" hidden><div class="card">
    <h2 id="resTitle">Finished</h2>
    <p id="resText"></p>
    <div class="btns"><button id="againBtn" type="button">Again</button><button id="resMenu" type="button">Menu</button></div>
  </div></div>

  <div class="deck">
    <div class="sliders only-race">
      <div class="ctl"><div class="row"><label class="label" for="rain">Rain</label><output id="rainOut" for="rain">Rain</output></div>
        <input id="rain" type="range" min="0" max="100" value="70"></div>
      <div class="ctl"><div class="row"><label class="label" for="wind">Wind</label><output id="windOut" for="wind">20 kn</output></div>
        <input id="wind" type="range" min="0" max="100" value="55"></div>
      <div class="ctl"><div class="row"><label class="label" for="waves">Waves</label><output id="wavesOut" for="waves">1.5 m</output></div>
        <input id="waves" type="range" min="0" max="100" value="45"></div>
    </div>
    <div class="btns">
      <button id="viewBtn" type="button">View: Astern</button>
      <button id="soundBtn" type="button" aria-pressed="false">Sound</button>
      <button id="pauseBtn" type="button" aria-pressed="false">Pause</button>
      <button id="menuBtn" type="button">Menu</button>
    </div>
  </div>
</div>
<div id="fail" hidden>This demo needs WebGL, which this browser or device has switched off.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const canvas=$('sea');
let renderer;
try{
  if(!window.THREE) throw new Error('no three');
  renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
}catch(e){ $('fail').hidden=false; $('app').hidden=true; return; }
renderer.outputEncoding=THREE.sRGBEncoding;
const reduceMotion=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- wind and swell definition (shared by GPU and boat physics) ---------- */
const windTo=new THREE.Vector2(0.6,-0.8);           // direction the wind blows toward (x,z)
const baseAng=Math.atan2(windTo.y,windTo.x);
const waves=[[64,.19,0],[39,.17,-.38],[24,.15,.46],[15,.14,-.62],[9.5,.12,.27],[6,.11,.75]].map((w,i)=>{
  const a=baseAng+w[2],k=2*Math.PI/w[0];
  return {L:w[0],st:w[1],dx:Math.cos(a),dz:Math.sin(a),k,w:Math.sqrt(9.81*k),ph:i*1.7};
});
let waveScale=.5;
function waveAt(x,z,t){
  let px=x,pz=z,y=0;
  for(let it=0;it<3;it++){
    let ox=0,oz=0;y=0;
    for(let i=0;i<waves.length;i++){
      const w=waves[i],f=w.k*(w.dx*px+w.dz*pz)-w.w*t+w.ph,a=w.st/w.k*waveScale,c=Math.cos(f);
      ox+=w.dx*a*c;oz+=w.dz*a*c;y+=a*Math.sin(f);
    }
    px=x-ox;pz=z-oz;
  }
  return y;
}
const F=n=>n.toFixed(5);
const gerstnerGLSL='void gerstner(vec2 p,float t,float r,out vec3 disp,out vec2 slope,out float pinch){\n'+
 'disp=vec3(0.);slope=vec2(0.);pinch=0.;float f,a,c,s;vec2 D;\n'+
 waves.map(w=>`D=vec2(${F(w.dx)},${F(w.dz)});f=${F(w.k)}*dot(D,p)-${F(w.w)}*t+${F(w.ph)};`+
  `a=${F(w.st/w.k)}*uWaveScale*(1.-smoothstep(${F(w.L*8)},${F(w.L*22)},r));c=cos(f);s=sin(f);`+
  `disp.xz+=D*(a*c);disp.y+=a*s;slope+=D*(${F(w.k)}*a*c);pinch+=${F(w.k)}*a*s;`).join('\n')+'\n}\n';

/* ---------- shared uniforms ---------- */
const U={
  uTime:{value:0},uStorm:{value:.6},uRain:{value:.6},uWind:{value:.6},uWaveScale:{value:.5},
  uAmpTotal:{value:1},uFlash:{value:0},uFogDensity:{value:.003},
  uSunDir:{value:new THREE.Vector3(.86,.30,.29).normalize()},
  uFogColor:{value:new THREE.Vector3(.3,.33,.36)},
  uWindDir:{value:windTo.clone()},uCenter:{value:new THREE.Vector2()},
  uTrail:{value:Array.from({length:20},()=>new THREE.Vector3(0,0,1))},uWake:{value:0},
  uCam:{value:new THREE.Vector3()},uVel:{value:new THREE.Vector3(0,-20,0)}
};

Object.assign(U,{uSkyTint:{value:new THREE.Vector3(1,1,1)},uChop:{value:1},uBodyDim:{value:1},uWakeW:{value:1},uReflOn:{value:0},
  uReflMat:{value:new THREE.Matrix4()},uReflTex:{value:null},uGust:{value:[0,1,2,3].map(()=>new THREE.Vector3(1e5,1e5,30))}});
const REF={};
const commonGLSL=`
uniform float uTime,uStorm,uRain,uWind,uWaveScale,uAmpTotal,uFlash,uFogDensity;
uniform vec3 uSunDir,uFogColor;
uniform vec2 uWindDir;
uniform vec3 uSkyTint;
float hash21(vec2 p){vec3 p3=fract(vec3(p.xyx)*.1031);p3+=dot(p3,p3.yzx+33.33);return fract((p3.x+p3.y)*p3.z);}
vec2 hash22(vec2 p){vec3 p3=fract(vec3(p.xyx)*vec3(.1031,.1030,.0973));p3+=dot(p3,p3.yzx+33.33);return fract((p3.xx+p3.yz)*p3.zy);}
float vnoise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
  return mix(mix(hash21(i),hash21(i+vec2(1.,0.)),f.x),mix(hash21(i+vec2(0.,1.)),hash21(i+vec2(1.,1.)),f.x),f.y);}
float fbm(vec2 p){float a=.5,s=0.;for(int i=0;i<4;i++){s+=a*vnoise(p);p=p*2.03+vec2(17.3,9.1);a*=.5;}return s;}
vec3 skyColor(vec3 d){
  float y=max(d.y,0.);
  vec2 uv=d.xz/(y+.18)*1.1+uWindDir*uTime*.012;
  float c=fbm(uv);
  float c2=fbm(uv*2.7+31.+uWindDir*uTime*.02);
  float cover=mix(.50,.12,uStorm);
  float cloud=smoothstep(cover,cover+.32,c);
  float thick=clamp(cloud*(.55+.9*c2),0.,1.);
  vec3 zen=mix(vec3(.11,.26,.56),vec3(.09,.11,.14),uStorm);
  vec3 base=mix(uFogColor,zen,pow(y,.45));
  float sunAmt=max(dot(d,uSunDir),0.);
  vec3 lit=mix(vec3(.80,.81,.83),vec3(.40,.43,.47),uStorm);
  vec3 dark=mix(vec3(.42,.47,.56),vec3(.07,.085,.105),uStorm);
  vec3 cc=mix(lit,dark,smoothstep(.25,1.,thick));
  cc+=vec3(1.,.86,.66)*pow(sunAmt,5.)*.55*(1.-.75*uStorm)*(1.-thick*.6);
  vec3 col=mix(base,cc,cloud);
  col+=vec3(1.,.9,.72)*(pow(sunAmt,900.)*14.+pow(sunAmt,40.)*.35)*(1.-cloud)*(1.-uStorm);
  col*=uSkyTint;
  col=mix(uFogColor,col,smoothstep(0.,.30,y)*.94);
  col+=uFlash*vec3(.75,.8,1.)*(.25+.6*thick)*smoothstep(-.05,.3,d.y);
  return col;
}
vec3 aces(vec3 x){return clamp((x*(2.51*x+.03))/(x*(2.43*x+.59)+.14),0.,1.);}
vec3 toDisplay(vec3 c){return pow(aces(c*1.15),vec3(1./2.2));}
vec3 fromDisplay(vec3 d){vec3 c=min(pow(d,vec3(2.2)),vec3(.90));vec3 b=.59*c-.03,a=2.43*c-2.51;
  return (-b-sqrt(max(b*b-.56*a*c,0.)))/(2.*a)/1.15;}
`;

/* ---------- scene ---------- */
const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0x445056,.003);
const camera=new THREE.PerspectiveCamera(55,1,.3,7000);

// sky dome
const sky=new THREE.Mesh(new THREE.SphereGeometry(3000,32,16),new THREE.ShaderMaterial({
  uniforms:U,side:THREE.BackSide,depthWrite:false,fog:false,
  vertexShader:`varying vec3 vDir;void main(){vDir=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:commonGLSL+`varying vec3 vDir;void main(){gl_FragColor=vec4(toDisplay(skyColor(normalize(vDir))),1.);}`
}));
sky.renderOrder=-10;sky.frustumCulled=false;scene.add(sky);

// water: polar grid, dense near the camera, reaching to the horizon
(function(){
  const NR=230,NA=256,a=5,b=Math.log(1800/a+1);
  const pos=new Float32Array(NR*NA*3),idx=[];
  for(let j=0;j<NR;j++){
    const r=a*(Math.exp(b*j/(NR-1))-1);
    for(let i=0;i<NA;i++){const th=i/NA*Math.PI*2,o=(j*NA+i)*3;pos[o]=r*Math.cos(th);pos[o+1]=0;pos[o+2]=r*Math.sin(th);}
  }
  for(let j=0;j<NR-1;j++)for(let i=0;i<NA;i++){
    const i2=(i+1)%NA,p0=j*NA+i,p1=j*NA+i2,p2=(j+1)*NA+i,p3=(j+1)*NA+i2;
    idx.push(p0,p2,p1,p1,p2,p3);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.setIndex(idx);
  const m=new THREE.ShaderMaterial({uniforms:U,side:THREE.DoubleSide,fog:false,extensions:{derivatives:true},
    vertexShader:commonGLSL+gerstnerGLSL+`
uniform vec2 uCenter;varying vec3 vWorld;varying vec2 vOrig;
void main(){
  vec2 p=position.xz+uCenter;vec3 d;vec2 sl;float pin;
  gerstner(p,uTime,length(position.xz),d,sl,pin);
  vOrig=p;vWorld=vec3(p.x,0.,p.y)+d;
  gl_Position=projectionMatrix*viewMatrix*vec4(vWorld,1.);
}`,
    fragmentShader:commonGLSL+gerstnerGLSL+`
uniform vec3 uTrail[20];uniform float uWake,uChop,uBodyDim,uWakeW,uReflOn;
uniform vec3 uGust[4];uniform sampler2D uReflTex;uniform mat4 uReflMat;
varying vec3 vWorld;varying vec2 vOrig;
float detailH(vec2 p,float fp){
  float it=0.,fr=1.25,tm=1.9,w=1.,s=0.,ws=0.;
  for(int i=0;i<12;i++){
    vec2 d=normalize(vec2(sin(it),cos(it))+uWindDir*.7);
    float x=dot(d,p)*fr-uTime*tm;
    float wave=exp(sin(x)-1.);
    p-=d*(wave*cos(x))*w*.30*(1.-smoothstep(.5,2.0,fr*fp));
    float att=1.-smoothstep(.5,2.0,fr*fp);
    s+=wave*w*att;ws+=w;
    w*=.80;fr*=1.26;tm*=1.09;it+=1232.399963;
  }
  return s/ws;
}
vec3 ripples(vec2 p,float cell,float seed){
  p/=cell;vec2 id=floor(p),f=fract(p);
  vec2 h=hash22(id+seed);
  float ph=uTime*(1.0+.6*h.x)+h.y*7.;
  float t=fract(ph),cyc=floor(ph);
  vec2 c=.3+.4*hash22(id+seed+cyc*.37);
  float on=step(hash21(id+seed*1.9+cyc*1.3),uRain);
  vec2 dl=f-c;float d=length(dl),r=t*.3;
  float ring=sin((d-r)*70.)*smoothstep(.05,0.,abs(d-r))*(1.-t)*(1.-t);
  return vec3(dl/max(d,1e-3)*ring*on,on*smoothstep(.04,0.,d)*step(t,.12));
}
void main(){
  vec3 toCam=cameraPosition-vWorld;float dist=length(toCam);vec3 V=toCam/dist;
  vec2 wp=vWorld.xz;
  vec3 gd;vec2 gs;float pinch;
  gerstner(vOrig,uTime,dist*.35,gd,gs,pinch);
  vec2 slope=gs/max(1.-pinch,.08);
  // wind chop
  float fp=max(length(dFdx(wp)),length(dFdy(wp)));
  float e=max(.05,fp*.8);
  float h0=detailH(wp,fp),hx=detailH(wp+vec2(e,0.),fp),hz=detailH(wp+vec2(0.,e),fp);
  float gm=0.;
  for(int i=0;i<4;i++){gm=max(gm,1.-smoothstep(uGust[i].z*.45,uGust[i].z,distance(wp,uGust[i].xy)));}
  float dAmp=(.22+.5*uWaveScale)*(.5+.8*uWind)*uChop*(1.+1.1*gm);
  float lod=1./(1.+dist*.004);
  slope+=vec2(hx-h0,hz-h0)/e*dAmp*lod;
  // rain rings
  float splash=0.;
  if(uRain>.01&&dist<70.){
    float rf=1.-smoothstep(22.,70.,dist);
    vec3 r1=ripples(wp,.34,0.),r2=ripples(wp+3.7,.58,11.),r3=ripples(wp+9.1,1.05,23.);
    slope+=(r1.xy+r2.xy*.8+r3.xy*.6)*.42*rf;
    splash=(r1.z+r2.z+r3.z)*rf;
  }
  // far rain stipple keeps distant water from reading as a mirror
  slope+=(hash22(floor(wp*3.)+floor(uTime*12.))-.5)*.10*uRain*smoothstep(8.,40.,dist)*(1.-smoothstep(.08,.3,fp));
  vec3 N=normalize(vec3(-slope.x,1.,-slope.y));
  float ndv=max(dot(N,V),.03);
  float Fr=.02+.98*pow(1.-ndv,5.);
  Fr*=mix(1.,.72,smoothstep(40.,600.,dist));
  vec3 R=reflect(-V,N);if(R.y<0.)R.y=-R.y*.5;
  vec3 refl=skyColor(normalize(R));
  if(uReflOn>.5){

  const master=ctx.createGain();master.gain.value=.5;master.connect(ctx.destination);

function step(dt){

   const dImm=Math.max(0,(imm-S.imm)/Math.max(dt,.001));S.imm=imm;

  const T=U.uTrail.value,fr=sinceTrail/SPACING;
  T[0].set(S.x+fx*4.8,S.z+fz*4.8,0);T[1].set(sx,sz,0);
